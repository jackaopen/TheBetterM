<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TheBetterM — Links</title>
  <style>
    * { box-sizing: border-box; }
    :root { color-scheme: light; font-family: "Segoe UI", sans-serif; }
    body { margin: 0; min-width: 340px; background: #f3f6f3; color: #172e32; }
    main { width: min(560px, 100%); margin: 0 auto; padding: 24px; }
    h1 { margin: 0 0 8px; font-size: 22px; }
    p { margin: 0 0 20px; color: #53666a; line-height: 1.5; }
    nav { display: grid; gap: 12px; }
    a { display: block; padding: 14px 16px; border: 1px solid #c7d5d1; border-radius: 8px; background: #fff; color: #12665e; text-decoration: none; }
    a:hover { background: #edf4f0; }
    a:focus-visible { outline: 2px solid #12665e; outline-offset: 3px; }
    strong { display: block; font-weight: 600; }
    small { display: block; margin-top: 5px; color: #53666a; line-height: 1.4; }
  </style>
</head>
<body>
  <main>
    <h1>TheBetterM</h1>
    <p>A better Moodle experience.</p>
    <nav aria-label="Project links">
      <a href="https://github.com/jackaopen/TheBetterM" target="_blank" rel="noopener noreferrer">
        <strong>GitHub</strong>
        <small>Source code, updates, and issues</small>
      </a>
      <!-- Replace the YouTube URL when the Chrome Web Store listing is published. -->
      <a target="_blank" rel="noopener noreferrer">
        <strong>Chrome Web Store — coming soon</strong>
        <small>The Chrome Web Store listing will be available soon.</small>
      </a>
    </nav>
  </main>
</body>
</html>
