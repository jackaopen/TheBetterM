<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TheBetterM — Appearance</title>
  <style>
    * { box-sizing: border-box; }
    :root { color-scheme: light; font-family: "Segoe UI", sans-serif; font-size: 14px; }
    body { margin: 0; min-width: 340px; background: #fafbf9; color: #25312c; }
    main { width: min(520px, 100%); margin: 0 auto; padding: 28px 24px; }
    header { padding-bottom: 20px; border-bottom: 1px solid #dde2dc; }
    h1 { margin: 0 0 4px; font-size: 21px; font-weight: 650; letter-spacing: -.4px; }
    h2 { margin: 0; font-size: 15px; font-weight: 600; }
    #appearance-form > h2 { font-weight: 800; }
    p { margin: 0; color: #657067; line-height: 1.6; }
    form { display: grid; gap: 18px; padding-top: 24px; }
    label { display: grid; gap: 8px; font-weight: 600; }
    input { width: 100%; min-width: 0; padding: 8px; border: 1px solid #d3dad2; border-radius: 5px; background: #fff; color: #657067; font: inherit; font-weight: 400; }
    input::file-selector-button { margin-right: 10px; padding: 6px 10px; border: 1px solid #d3dad2; border-radius: 3px; background: #f2f4ef; color: #25312c; font: inherit; cursor: pointer; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; }
    button { padding: 9px 14px; border: 1px solid #d3dad2; border-radius: 5px; background: #fff; color: #25312c; font: inherit; font-weight: 600; cursor: pointer; }
    button:hover, input::file-selector-button:hover { background: #edf0e9; }
    button[type="submit"] { background: #365b46; border-color: #365b46; color: #fff; }
    button[type="submit"]:hover { background: #2c4c3a; }
    button:disabled { opacity: .6; cursor: wait; }
    :is(a, button, input):focus-visible { outline: 2px solid #365b46; outline-offset: 3px; }
    small { display: block; color: #657067; font-size: 12px; line-height: 1.6; }
    #appearance-status { min-height: 20px; overflow-wrap: anywhere; }
    nav { display: grid; border-top: 1px solid #dde2dc; }
    nav h2 { padding: 20px 0 8px; }
    a { display: block; padding: 12px 0; color: #365b46; text-decoration: none; }
    a + a { border-top: 1px solid #e6e9e3; }
    a:hover strong { text-decoration: underline; }
    strong { display: block; font-weight: 600; }
    a small { margin-top: 3px; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>TheBetterM</h1>
      <p>A better Moodle experience.</p>
    </header>
    <form id="appearance-form">
      <h2>Appearance</h2>
      <small>Choose one or both images, then save. Other images stay unchanged.<br>Stored on this device. Use defaults resets both images.</small>

      <label><h2>Background image</h2>
        <input type="file" name="customBackground" accept="image/*">
      </label>
      <label><h2>Header image</h2>
        <input type="file" name="customHeader" accept="image/*">
      </label>
      <div class="actions">
        <button type="submit">Save</button>
        <button type="button" id="appearance-defaults">Use defaults</button>
      </div>
      <small id="appearance-status" role="status"></small>
    </form>
    <nav aria-label="Project links">
      <h2>Project links</h2>
      <a href="https://github.com/jackaopen/TheBetterM" target="_blank" rel="noopener noreferrer">
        <strong>GitHub</strong>
        <small>Source code, updates, and issues</small>
      </a>
      <a href="https://chromewebstore.google.com/detail/thebetterm-%E2%80%94-moodle-refre/ilkjjkjdocgjpljdkikeobcclpegjlpf" target="_blank" rel="noopener noreferrer">
        <strong>Chrome Web Store</strong>
        <small>Get the extension from Chrome Web Store.</small>
      </a>
    </nav>
  </main>
  <script src="appearance.js"></script>
</body>
</html>
